[package]
name = "study-bridge"
version = "1.0.0"
description = "学习桥梁桌面端"
authors = ["studybridge"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 连接 http:// 的内网地址时，需要在 tauri.conf.json 的 allowlist/CSP 里放行；
# 生产建议用 https + 受信任证书（见 docs/DEPLOY.md 形态 C）。
