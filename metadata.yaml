name: astrbot_plugin_study_bridge
display_name: 学习桥梁 · AI 学习助手
short_desc: AI 拆解学习计划并写入日程，QQ 与 App 双端同一份数据
desc: |
  # 学习桥梁（Study Bridge）

  给 AstrBot 加一套「学习日程 + AI 计划 + 记忆同步」能力：

  - **AI 拆计划并真实写入日程**：`/plan new 考研数学` → AI 出计划 → `/apply` 落库
  - **App / QQ 同一份数据**：Web、Windows、Android 三端只填一个服务地址即可，数据全部留在你自己的 AstrBot 机器上
  - **纯 QQ 也能闭环**：`/add` `/today` `/week` `/report` `/export` `/memory` 全部可用，不需要装 App
  - **早报与提醒**：到点推送到指定私聊/群，重启不重发
  - **记忆互通（可选）**：检测到第三方记忆插件时上行学习偏好、下行 bot 记忆；没装也能正常用（降级为本地记忆）
  - **无公网 IP 可用**：支持局域网、反代与内网穿透

  详细文档见仓库 `docs/`，App 使用说明见 `README.md`。
